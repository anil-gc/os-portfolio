{% if messages %}
  <div class="alerts" aria-live="polite">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'success' %}alert-success{% endif %}" role="status">
        {% include 'dashboard/partials/icon.html' with name='check' %}
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
